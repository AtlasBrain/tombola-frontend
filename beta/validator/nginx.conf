events {
    worker_connections 1024;
}

http {
    # Route HTTP vs WebSocket to different validator ports
    map $http_upgrade $solana_backend {
        "websocket" "http://127.0.0.1:8900";
        default     "http://127.0.0.1:8899";
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # Needed so nginx accepts variables in proxy_pass
    resolver 1.1.1.1 valid=30s;

    server {
        listen 80;

        # Allow all origins so Phantom and the Next.js app can connect
        add_header "Access-Control-Allow-Origin"  "*" always;
        add_header "Access-Control-Allow-Methods" "GET, POST, OPTIONS" always;
        add_header "Access-Control-Allow-Headers" "Content-Type" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        location /health {
            default_type application/json;
            return 200 '{"ok":true}';
        }

        location / {
            proxy_pass         $solana_backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection $connection_upgrade;
            proxy_set_header   Host       $host;
            proxy_read_timeout 300s;
        }
    }
}
